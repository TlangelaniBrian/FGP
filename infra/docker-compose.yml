services:
  postgis:
    image: postgis/postgis:15-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../apps/worker
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgis:5432/postgres
      REDIS_URL: redis://redis:6379
      WORKER_SERVICE_TOKEN: ${WORKER_SERVICE_TOKEN:-local-development-worker-token}
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/worker:/app
      # Keep the image's Linux virtualenv out of the bind mount. Without this the
      # host .venv shadows it, so a host-side `uv run` (which recreates .venv)
      # tears the running worker's interpreter out from under it.
      - worker_venv:/app/.venv
    # Reload on source only; watching the whole tree makes any .venv churn
    # restart — and often wedge — the worker.
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/routers --reload-dir /app/services
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /workspace
    command: dotnet run --project apps/api/src/FGP.Api/FGP.Api.csproj --no-launch-profile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Fgp: Host=postgis;Port=5432;Database=postgres;Username=postgres;Password=postgres
      Worker__BaseUrl: http://worker:8000
      Worker__ServiceToken: ${WORKER_SERVICE_TOKEN:-local-development-worker-token}
      Redis__ConnectionString: redis:6379
      Email__SmtpHost: mailpit
      Email__SmtpPort: 1025
      Web__PublicOrigin: http://localhost:3000
      # Absolute, so generated PDFs never land next to the source regardless of
      # the process working directory.
      Artifacts__StoragePath: /workspace/.artifacts
    ports:
      - "8080:8080"
    volumes:
      - ../:/workspace
    depends_on:
      postgis:
        condition: service_healthy
      worker:
        condition: service_healthy

volumes:
  postgis_data:
  worker_venv:
